name: Verify Lean 4 & Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run practical number verifier & lemma test suite
        run: |
          python3 scripts/verify_practical.py --self-test
          python3 scripts/test_alpha5_lemmas.py

  lean-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Static integrity scan (zero sorry/admit/axiom/native_decide)
        run: |
          if grep -rnE '\b(sorry|admit|axiom|opaque|unsafe|native_decide|implemented_by|extern|sorryAx)\b' erdos18_lean/Erdos18/ erdos18_lean/Erdos18.lean erdos18_lean/Verify.lean; then
            echo "ERROR: Forbidden keyword detected in Lean proof!"
            exit 1
          fi
          echo "Static scan clean."

      - name: Fetch Mathlib cache & build Erdos18
        working-directory: erdos18_lean
        run: |
          lake exe cache get || true
          lake build

      - name: Verify top-level theorem & axioms (Verify.lean)
        working-directory: erdos18_lean
        run: |
          OUT=$(lake env lean Verify.lean 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q "check_statement"
          if echo "$OUT" | grep -qE "sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler"; then
            echo "ERROR: Non-standard axiom detected!"
            exit 1
          fi

      - name: Verify standalone core (lean/Erdos18Alpha5.lean)
        working-directory: erdos18_lean
        run: |
          lake env lean ../lean/Erdos18Alpha5.lean
